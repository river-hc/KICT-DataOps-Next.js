services:
  postgres:
    image: postgres:16
    container_name: kict-dataops-postgres
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: aidb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kict-dataops-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://aiuser:aipass@postgres:5432/aidb
      RUNS_DIR: /app/runs
      TRAINER_DIR: /app/trainer
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - ./backend/runs:/app/runs
      - ./backend/trainer:/app/trainer
      - /home/harry/models:/home/harry/models
      - /home/harry/data:/home/harry/data
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: kict-dataops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
